outcomes:

  # ---- R1: adr natural task list — add pick (seed 201) ---- LANDED as-is
  - id: R1
    status: implemented
    action: edit
    file: lib/axisConfig.py
    target: CROSS_AXIS_COMPOSITION[channel][adr][task].natural
    change: "[plan, probe, make] -> [plan, probe, make, pick]"
    reason: >
      adr's Description says "Best suited for decision-making tasks"; pick IS a decision
      task. Seed 201 (pick+adr+struct+full) scored 4/5 with adr+pick as the coherent core.
    evidence: [seed_201]
    verified: "bar help llm --section heuristics shows adr natural task: plan, probe, make, pick"

  # ---- R6: pull + deep operational tension (seed 203) ---- LANDED as composition
  # Originally filed as a description edit (confidence low). Reclassified: the tension
  # is co-presence interaction, not a defect in either token's definition -> composition.
  - id: R6
    status: implemented
    action: composition-add
    file: lib/compositionConfig.py
    entry: pull+deep
    rule: >
      deep governs how much of the selected subset to carry across, NOT a licence to
      unpack/elaborate/add reasoning beyond the source. Depth of selection, not depth of
      expansion. Gate clause: a response that introduces analysis or content not present
      in the source to satisfy deep does not satisfy pull, and does not satisfy this
      composition.
    evidence: [seed_203]
    verified: "activates on `bar build pull deep`; bar help composition pull+deep renders"

  # ---- R4: browse (fetch channel) + pull given-material task (seed 203) ---- LANDED as composition
  # Originally filed as a cautionary entry (confidence low). Reclassified: the ordering
  # dependency (fetch-then-extract) is non-derivable from the universal rule -> composition.
  - id: R4
    status: implemented
    action: composition-add
    file: lib/compositionConfig.py
    entry: browse+pull
    rule: >
      Sequencing: browse first produces the material, then pull extracts its subset from
      that produced result. Gate clause: a pull whose subset is drawn from material no
      prior browse result produced does not satisfy this composition.
    evidence: [seed_203]
    verified: "bar help composition browse+pull renders with gate clause"

  # ---- R5: paradox/mu + transformation tasks (seed 206) ---- REFRAMED then LANDED as composition
  # Original diagnosis: skill-update warning ("do not route tension methods to
  # transformation tasks"). First implemented in help_llm.go (WRONG LAYER: a selection
  # warning in a taxonomy section), then moved to guidebookConfig.py (a warning).
  # FINAL (user direction): the pairing is NOT irreconcilable. Defined the coherent
  # combined meaning as composition rules and dropped the warning entirely.
  - id: R5
    status: implemented
    action: composition-add
    file: lib/compositionConfig.py
    entries: [paradox+fix, mu+fix]
    rule: >
      fix transforms the presentation while keeping intended meaning; the source's
      unresolved tension IS part of that meaning. Combined: change the form so the tension
      is preserved and made legible (paradox) / enacted structurally so the reader cannot
      settle it (mu). Gate clause: a reformat that resolves/harmonizes/hides the tension
      has altered the meaning and does not satisfy fix; a reformat that adds synthesis does
      not satisfy paradox.
    not_added:
      - "paradox+make / mu+make: NO entry — creating tension-holding content is native to
         paradox/mu; an interaction rule would restate the solo token (orthogonality)."
    superseded:
      - "help_llm.go Tension-class methods note (added then reverted — wrong layer)"
      - "guidebookConfig.py tension-methods-vs-convergent-tasks entry (added then reverted —
         reframed from warning to defined meaning)"
    evidence: [seed_206]
    compare-mode: distinguishable   # see distinction-check.md
    verified: "activates on `bar build fix paradox`; bar help composition paradox+fix, mu+fix render"

