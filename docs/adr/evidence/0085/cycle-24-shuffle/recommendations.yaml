recommendations:

  # ---- R1 (c24): contextualise + sketch/svg — RESOLVED AS COMPOSITION (not cautionary) ----
  # Originally proposed as a cautionary (matching contextualise's existing gherkin/codetour
  # cautions). Reclassified on review: there IS a coherent combined output — the DSL artifact
  # stays pure and contextualise's enrichment goes in an ADJACENT prose block. This is exactly
  # the pattern the shipped ghost+svg / prep+svg / twin+svg composition entries use, so the
  # resolution belongs in the composition layer, not a "use plain or no channel" warning.
  - id: c24-R1
    status: implemented
    action: composition-add
    file: lib/compositionConfig.py
    entries: [contextualise+sketch, contextualise+svg]
    rule: >
      Keep the DSL/markup artifact pure; place contextualise's enrichment (background,
      assumptions, constraints, framing) in a separate prose block before/after the artifact,
      not inside it. Gate clause: prose embedded in the artifact does not satisfy contextualise;
      an artifact with no adjacent context block does not satisfy contextualise either.
    reason: >
      Same prose-form-meets-DSL-only-channel mechanism as ghost+svg, prep+svg, twin+svg — which
      are compositions, not warnings. contextualise simply wasn't wired into that family. A
      coherent coexisting output exists (artifact + adjacent block), so composition beats
      cautionary.
    evidence: [seed_208]
    confidence: high
    verified: "bar help composition contextualise+sketch, contextualise+svg render; activates on co-presence"
    note: >
      Bonus observation (NOT acted on this cycle): contextualise's EXISTING gherkin/shellscript/
      codetour cautionary entries are arguably mis-layered for the same reason — they could
      become compositions (prose block adjacent) too. Recorded as c24-O4 for a future cycle;
      re-opening shipped decisions is out of scope here.

  # ---- R2 (c24): skim + orbit — cautionary (correct layer: no combined output exists) ----
  # Confirmed cautionary, NOT composition: honoring orbit's multi-trajectory minimum starves
  # skim's light pass — there is no coexisting output (unlike contextualise+sketch, where two
  # artifacts sit adjacent; here it's the same output pulled to incompatible depths). Matches
  # the shipped skim+rigor cautionary.
  - id: c24-R2
    status: implemented
    action: cautionary-entry
    file: lib/axisConfig.py
    target: CROSS_AXIS_COMPOSITION[completeness][skim][method].cautionary
    add:
      orbit: >
        skim constrains response volume; orbit requires multiple distinct trajectories
        with differing named initial conditions to establish an attractor —
        the light pass cannot accommodate that evidentiary minimum; expect score-3 output
    verified: "renders in bar help llm --section heuristics under orbit"
    reason: >
      skim ALREADY cautions `rigor` with the same reasoning ("the light pass cannot
      accommodate rigorous reasoning; expect score-3 output"). orbit has a structural
      minimum (multiple trajectories with distinct named initial conditions) that a skim
      light pass cannot meet — the identical completeness-floor-vs-method-minimum mechanism.
      Seed 210 (fix+skim+orbit+store+ong) scored 2/5.
    evidence: [seed_210]
    confidence: high   # extends an existing, identical-mechanism cautionary (skim+rigor)
    compare-mode: see distinction-check.md

