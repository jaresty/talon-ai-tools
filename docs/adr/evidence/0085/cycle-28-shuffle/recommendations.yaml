outcomes:
  - id: c28-R1
    status: implemented-differently
    original: "add a contextualise+zettel composition (precedent: snap+zettel)"
    final: >
      NOT added as a pairwise entry. The reviewer asked whether the behavior belongs in zettel's
      DEFINITION — it does. zettel already said "a body that does is two notes" but said nothing
      about composite input arriving as one unit. Added that general clause to zettel's definition
      (decompose into one-claim notes plus an entry note carrying the cross-cutting part), and
      REMOVED the snap+zettel composition, which stated the same behavior for one pairing. The
      contextualise+zettel entry became unnecessary.
    verified: "bar help token zettel renders the composite clause; snap+zettel no longer a composition"

  - id: c28-R2
    status: implemented
    file: lib/axisConfig.py
    change: >
      Cross-axis entries for the three constructor channels: agent, skill, image. Each natural task
      [make]; cautionary for analysis/transform tasks stating DELIVERABLE SUBSTITUTION (the reader
      receives a spec for something that would do the task rather than the output they asked for).
      image gets sharper reasons: image×fix cites that fix succeeds only if meaning is preserved and
      an image cannot be compared against the source to check it; image×pull cites that an image is
      a new artifact rather than the extracted material.
    evidence: [seed_244, seed_259, "cycle-23 seed_204"]
    verified: "agent/skill/image natural=[make]; agent×diff still flagged"

  - id: c28-R3
    status: implemented-as-definition
    original: "generalize pull's select-not-add principle (deferred pending a design decision on where it lives)"
    final: >
      The design decision resolved with R1's: it lives in pull's DEFINITION. pull was a bare
      8-word sentence ("Extracting a subset of information from source material.") while the whole
      select-not-add principle sat inside the pull+deep composition — so it never governed
      pull+models, pull+jobs or pull+ontology. Added to pull's definition in
      lib/staticPromptConfig.py; REMOVED the pull+deep composition.
    verified: "bar help token pull renders the select-within clause; pull+deep no longer a composition"

  - id: c28-ADR
    status: implemented
    change: >
      New ADR-0085 rule: "A pairwise entry that states a fact about ONE token belongs in that
      token's definition." Includes the strip-one-token test, both confirmed instances, and the
      diagnostic symptom (a queue of near-identical pairwise candidates is one missing definition
      clause reported N times). Also appended as a corollary to the description-purity principle
      note (nn 20260929154929-2747).

