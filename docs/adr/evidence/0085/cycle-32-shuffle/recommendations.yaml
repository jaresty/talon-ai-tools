      cross-axis content moved from Token Guidance to Choosing Channel").
      Per the ground+falsify guard-edit entry point, the property was named and confirmed by execution
      BEFORE the guard was touched: renderLLMHelpAllSections was probed and both migrated strings were
      observed present.
    verified: "go test ./internal/barcli/... — ok (was: FAIL D5)"

observations:
  - id: c32-O1
    topic: "cautionaries are selection-path, not execution-path — no cautionary has ever guided a shuffle response"
    detail: >
      Verifying R3 raised the question of where cautionary text actually renders. An initial claim that it
      is TUI-only was REFUTED by execution: `bar help llm --section heuristics` carries it (line ~406 for
      bug), and that section is agent-reachable and advertised in the `bar help llm` navigation endpoint.
      The accurate split is by ROLE, not by interface:
        - carries cautionaries: `bar help llm --section heuristics`, interactive TUI   (token SELECTION)
        - does not: `bar build <tokens>`, `bar help token <slug>`                      (token EXECUTION)
      This is coherent by design — a warning not to pick bug+fix is useless once bug+fix is the instruction.
      CONSEQUENCE FOR ADR-0085: a shuffle draw arrives with tokens already chosen, so no cautionary has ever
      guided a shuffle response. A low score on a cautioned pair confirms the pair is bad; it is never evidence
      the catalog handled it, and per nn 20260929194833-0640 the attributed cause may still be wrong. Every
      "cautionary fired" in cycles 23-32 evidence means "is present in config", never "was delivered".
      This also settles the open followup: rendering cautionaries into the build prompt is the WRONG fix,
      since it would inject 'you should have picked differently' into a prompt whose tokens are fixed.
    confidence: high   # established by execution on four paths, including against known-good commit+max
