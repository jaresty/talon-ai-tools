    status: implemented
    action: test-guard-update
    file: internal/barcli/help_llm_test.go
    guard: TestLLMHelpADR0107TokenDescriptions / D5
    reason: >
      D5 asserted 'diagnostic and debugging' appears in ## Token Catalog. R3 moved that content to
      CROSS_AXIS_COMPOSITION, so it now renders in ### Choosing Form. The PROPERTY the guard observes
